name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project files
        run: |
          echo "=== repo files ==="
          find . -path ./.git -prune -o -type f -print | head -n 50
          SPEC=$(find . -name buildozer.spec -not -path "./.git/*" | head -n 1)
          if [ -z "$SPEC" ]; then
            ZIP=$(find . -maxdepth 3 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: no buildozer.spec and no .zip in the repository"
              exit 1
            fi
            echo "Using archive: $ZIP"
            rm -rf _proj
            unzip -o "$ZIP" -d _proj
            echo "=== zip content ==="
            find _proj -maxdepth 3
            SPEC=$(find _proj -name buildozer.spec | head -n 1)
            if [ -z "$SPEC" ]; then
              echo "ERROR: buildozer.spec not found inside the archive"
              exit 1
            fi
          fi
          DIR=$(dirname "$SPEC")
          if [ "$DIR" != "." ]; then
            cp -r "$DIR"/. .
          fi
          ls -la

      - name: Pin python-for-android version
        run: |
          grep -q "^p4a.branch" buildozer.spec || sed -i '/^\[app\]/a p4a.branch = v2024.01.21' buildozer.spec
          cat buildozer.spec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer "cython==0.29.36"

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors (only on failure)
        if: failure()
        run: |
          echo "===== ERROR LINES ====="
          grep -n -i -E "error|failed|exception|not found" build.log | grep -v -i -E "deprecated|warning" | tail -n 30 || true
          echo "===== LAST 40 LINES ====="
          tail -n 40 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: softbox-apk
          path: bin/*.apk
